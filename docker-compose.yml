services:
  dolibarr-db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DOLIBARR_DB_ROOT_PASSWORD:-Admin.123}
      MYSQL_DATABASE: ${DOLIBARR_DB_NAME:-dolibarr}
      MYSQL_USER: ${DOLIBARR_DB_USER:-dolibarr_user}
      MYSQL_PASSWORD: ${DOLIBARR_DB_PASSWORD:-Admin.123}
      TZ: ${TZ:-Asia/Karachi}
    volumes:
      - standalone-dolibarr-mariadb-data:/var/lib/mysql

  dolibarr:
    image: tuxgasy/dolibarr:latest
    restart: always
    depends_on:
      - dolibarr-db
    ports:
      - "8087:80"
    environment:
      DOLI_DB_HOST: dolibarr-db
      DOLI_DB_NAME: ${DOLIBARR_DB_NAME:-dolibarr}
      DOLI_DB_USER: ${DOLIBARR_DB_USER:-dolibarr_user}
      DOLI_DB_PASSWORD: ${DOLIBARR_DB_PASSWORD:-Admin.123}
      DOLI_ADMIN_LOGIN: ${DOLIBARR_ADMIN_LOGIN:-admin}
      DOLI_ADMIN_PASSWORD: ${DOLIBARR_ADMIN_PASSWORD:-Admin.123}
      TZ: ${TZ:-Asia/Karachi}
    volumes:
      - standalone-dolibarr-docs-data:/var/documents
      - standalone-dolibarr-custom-data:/var/www/html/custom
    networks:
      - default
      - web_network

volumes:
  standalone-dolibarr-mariadb-data:
    external: true
  standalone-dolibarr-docs-data:
    external: true
  standalone-dolibarr-custom-data:
    external: true

networks:
  web_network:
    external: true
